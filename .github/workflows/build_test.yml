name: CI - Build & Test

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # keep CI aligned with repo Node version

      - name: Install dependencies
        run: npm ci   # ← clean install（package-lock.json準拠で高速・安全）

      - name: TypeScript Check
        run: npx tsc --noEmit   # 型エラーを事前検知（build前に走らせるのがベスト）

      - name: Lint (ESLint)
        run: npm run lint -- --max-warnings=0   # ← lintスクリプトがあれば（なければ後述）

      - name: Build
        run: npm run build

      - name: Summary
        run: echo "✅ Build succeeded on ${{ github.ref }}"